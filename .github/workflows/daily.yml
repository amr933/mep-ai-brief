name: Daily MEP Newsletter

on:
  schedule:
    # 05:00 UTC = 08:00 Egypt (UTC+3)
    - cron: '0 5 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

# Let the workflow commit the generated pages back to the repo
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate newsletter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEP_LLM_API_KEY: ${{ secrets.MEP_LLM_API_KEY }}
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
        run: python scripts/generate_newsletter.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Commit and push web edition
        run: |
          git config user.name "MEP Newsletter Bot"
          git config user.email "actions@github.com"
          git add site
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(site): daily newsletter issue [skip ci]"
            git push
          fi
